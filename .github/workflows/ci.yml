name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # No secrets: every test runs against fakes or a mock transport, so CI
        # never spends the Groq free tier or needs a live n8n. The eval suite is
        # the thing that talks to real services, and it is run deliberately.
        run: pytest -q

  preflight:
    # Only meaningful where the secrets exist; skipped on forks by design.
    if: github.event_name == 'push' && github.repository_owner != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gate checks
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/preflight.py --json
