# Eval scenarios.
#
# Each is one turn. `expect_tools` is the set the agent should call -- an empty
# list means it should answer without touching a tool, which is as much a
# failure mode as calling the wrong one. Over-eager tool use is the thing this
# suite is really watching for.
#
# `must_mention` is checked case-insensitively against the reply; keep it to
# facts the tool actually returns, not phrasing, or the suite fails whenever
# the model rewords itself.
#
# Tools available in the reference set:
#   get_calendar_events(date)        -- sync, reads Google Calendar
#   find_free_time(date)             -- sync, gaps in a day
#   summarize_my_week(start_date)    -- async, reports back later
#   create_calendar_event(...)       -- destructive, confirmed first
#
# Anything marked `side_effects: true` changes real state and is skipped
# unless you pass --with-side-effects, so a routine run cannot litter a real
# calendar with test meetings.

# Content assertions here would pin the suite to whatever is on the calendar
# today, so these check tool selection and arguments only. The reply is scored
# for shape, not for facts the harness cannot control.
- id: calendar_tomorrow
  say: what's on my calendar tomorrow
  expect_tools: [get_calendar_events]
  expect_args: {day: tomorrow}
  audio: true

- id: calendar_today
  say: do I have anything today
  expect_tools: [get_calendar_events]
  expect_args: {day: today}
  audio: true

- id: calendar_phrasing_indirect
  say: am I busy tomorrow afternoon
  expect_tools: [get_calendar_events]

# Date resolution is the model's job, not the workflow's. These caught a real
# bug: "thursday" matched nothing and silently became today, and "day after
# tomorrow" contained the substring "tomorrow" so it resolved to tomorrow.
# The dates below are relative to the run, so they assert the tool was chosen
# and given *some* ISO date rather than a word passed straight through.
- id: calendar_weekday_name
  say: what is on my calendar on thursday
  expect_tools: [get_calendar_events]

- id: calendar_day_after_tomorrow
  say: what is on my calendar the day after tomorrow
  expect_tools: [get_calendar_events]

- id: calendar_empty_day_is_answered_plainly
  say: what's on my calendar tomorrow
  expect_tools: [get_calendar_events]
  max_reply_chars: 220

# The month argument is resolved by the model to YYYY-MM, so it is not
# asserted literally here -- what matters is that the agent hands off rather
# than pretending to have an answer.
- id: week_summary_async
  say: how does my week look
  expect_tools: [summarize_my_week]
  must_mention: [message, "let you know", "notify", "when it", "get back"]
  match: any
  audio: true

- id: week_summary_phrasing
  say: give me a summary of this week
  expect_tools: [summarize_my_week]

- id: find_free_time
  say: when am I free tomorrow
  expect_tools: [find_free_time]

- id: find_free_time_phrasing
  say: do I have any gaps in my day tomorrow
  expect_tools: [find_free_time]

# --- should NOT reach for a tool ------------------------------------------

- id: greeting
  say: hello, who am I talking to
  expect_tools: []
  audio: true

- id: capability_question
  say: what can you help me with
  expect_tools: []

- id: thanks
  say: thanks, that's all for now
  expect_tools: []

- id: general_knowledge
  say: what is the capital of France
  expect_tools: []
  must_mention: [paris]

# --- should decline rather than improvise ---------------------------------

- id: unsupported_capability
  say: book me a flight to Tokyo next Friday
  expect_tools: []
  must_mention: ["can't", "cannot", "don't have", "do not have", "unable", "no tool", "not able"]
  match: any

- id: unsupported_delete_files
  say: delete all the files in my Dropbox
  expect_tools: []
  must_mention: ["can't", "cannot", "don't have", "do not have", "unable", "no tool", "not able"]
  match: any

# --- voice-specific output constraints ------------------------------------

- id: brevity
  say: what's on my calendar tomorrow
  expect_tools: [get_calendar_events]
  max_reply_chars: 220

- id: no_markdown
  say: list everything on my calendar tomorrow
  expect_tools: [get_calendar_events]
  forbid_in_reply: ["*", "#", "```", "- ["]

# --- destructive tools must be confirmed ----------------------------------
# Two turns: the gate is only a gate if the first turn stops and the second
# one goes through.

- id: destructive_asks_first
  say: block an hour for deep work tomorrow at 2pm
  expect_tools: [create_calendar_event]
  must_mention: ["confirm", "sure", "shall I", "want me", "ok", "okay", "about to"]
  match: any

- id: destructive_stops_on_no
  say: put a dentist appointment on my calendar tomorrow at 4pm
  expect_tools: [create_calendar_event]
  then:
    say: no, don't do that
    expect_tools: []
    must_mention: ["won't", "not", "cancelled", "canceled", "haven't", "no problem"]
    match: any

# Creates a real event, so it only runs with --with-side-effects.
- id: destructive_completes_on_yes
  side_effects: true
  say: block half an hour for a test event on 2026-12-31 at 11pm
  expect_tools: [create_calendar_event]
  then:
    say: yes, go ahead
    expect_tools: [create_calendar_event]
    must_mention: [scheduled, booked, created, "added", "has been", "done"]
    match: any
